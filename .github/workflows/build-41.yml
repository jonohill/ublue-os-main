name: ublue main 41
on:
  pull_request:
  merge_group:
  # schedule:
  #   - cron: '5 4 * * *'  # 4am-ish UTC everyday (timed against official fedora container pushes)
  workflow_dispatch:
  push:

jobs:

  build:
    name: build
    uses: ./.github/workflows/reusable-build.yml
    secrets: inherit
    with:
      fedora_version: 41

  build_arm64:
    name: build arm64
    uses: ./.github/workflows/reusable-build.yml
    secrets: inherit
    with:
      fedora_version: 41
      runs_on: ubuntu-24.04-arm
